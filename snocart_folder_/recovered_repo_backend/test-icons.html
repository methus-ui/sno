<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Icon Test</title>
    <link rel="stylesheet" href="/public/assets/admin/vendor/fontawesome-free/css/all.min.css">
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            padding: 40px;
            font-family: Arial, sans-serif;
        }
        .icon-test {
            font-size: 24px;
            margin: 20px 0;
            padding: 20px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
        }
        .icon-test i {
            margin-right: 10px;
            color: #D8276B;
        }
        h1 { color: #D8276B; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h1>FontAwesome Icon Test</h1>

    <div class="icon-test">
        <i class="fas fa-check"></i> Check Icon (fas fa-check)
    </div>

    <div class="icon-test">
        <i class="fas fa-shopping-cart"></i> Shopping Cart (fas fa-shopping-cart)
    </div>

    <div class="icon-test">
        <i class="fas fa-clock"></i> Clock (fas fa-clock)
    </div>

    <div class="icon-test">
        <i class="fas fa-motorcycle"></i> Motorcycle (fas fa-motorcycle)
    </div>

    <div class="icon-test">
        <i class="fas fa-chart-bar"></i> Chart Bar (fas fa-chart-bar)
    </div>

    <div class="icon-test">
        <i class="fas fa-chart-line"></i> Chart Line (fas fa-chart-line)
    </div>

    <div class="icon-test">
        <i class="fas fa-chart-pie"></i> Chart Pie (fas fa-chart-pie)
    </div>

    <script>
        // Check if icons loaded
        setTimeout(function() {
            var testIcon = document.querySelector('.fas');
            var computedStyle = window.getComputedStyle(testIcon, ':before');
            var content = computedStyle.getPropertyValue('content');

            if (!content || content === 'none' || content === '') {
                document.body.innerHTML += '<h2 class="error">❌ Icons NOT loading - FontAwesome CSS issue</h2>';
            } else {
                document.body.innerHTML += '<h2 class="success">✅ Icons loaded successfully!</h2>';
            }
        }, 500);
    </script>
</body>
</html>
