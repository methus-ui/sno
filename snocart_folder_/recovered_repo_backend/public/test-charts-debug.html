<!DOCTYPE html>
<html>
<head>
    <title>Chart Debug Test</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.44.0/dist/apexcharts.min.js"></script>
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: monospace;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .chart {
            height: 400px;
            background: #252525;
            margin: 10px 0;
            border-radius: 8px;
            padding: 20px;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 11px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        h2 { color: #D8276B; }
    </style>
</head>
<body>
    <h1>🔍 Delivery Stats Charts - Debug Test</h1>

    <div class="test-section">
        <h2>1. API Connectivity Test</h2>
        <div id="api-test">Testing...</div>
    </div>

    <div class="test-section">
        <h2>2. Status Chart Data</h2>
        <pre id="status-data">Loading...</pre>
        <div id="status-chart" class="chart"></div>
    </div>

    <div class="test-section">
        <h2>3. Hourly Chart Data</h2>
        <pre id="hourly-data">Loading...</pre>
        <div id="hourly-chart" class="chart"></div>
    </div>

    <div class="test-section">
        <h2>4. 90-Day Trend Data</h2>
        <pre id="trend-data">Loading...</pre>
        <div id="trend-chart" class="chart"></div>
    </div>

    <script>
        console.log('🟢 Test page loaded');
        console.log('🟢 ApexCharts available:', typeof ApexCharts);

        const baseUrl = window.location.origin + '/admin/delivery-stats/chart/';
        const today = new Date().toISOString().split('T')[0];
        const params = `zone_id=all&module_id=2&date=${today}`;

        // Test API connectivity
        async function testAPI() {
            const testDiv = document.getElementById('api-test');
            try {
                const response = await fetch(`${baseUrl}status?${params}`);
                console.log('API Response:', response);

                if (response.ok) {
                    testDiv.innerHTML = `<span class="success">✅ API responding (${response.status})</span>`;
                    return true;
                } else {
                    testDiv.innerHTML = `<span class="error">❌ API Error: ${response.status} ${response.statusText}</span>`;
                    const text = await response.text();
                    testDiv.innerHTML += `<pre>${text.substring(0, 500)}</pre>`;
                    return false;
                }
            } catch (error) {
                testDiv.innerHTML = `<span class="error">❌ Network Error: ${error.message}</span>`;
                console.error('API Test Error:', error);
                return false;
            }
        }

        // Test Status Chart
        async function testStatusChart() {
            const dataDiv = document.getElementById('status-data');
            try {
                console.log('Fetching status data from:', `${baseUrl}status?${params}`);
                const response = await fetch(`${baseUrl}status?${params}`);
                const result = await response.json();

                console.log('Status data received:', result);
                dataDiv.textContent = JSON.stringify(result, null, 2);

                if (result.success && result.data) {
                    const statuses = result.data.statuses || [];
                    const series = statuses.map(s => s.count);
                    const labels = statuses.map(s => s.label);
                    const colors = statuses.map(s => s.color);

                    console.log('Creating status chart with:', {series, labels, colors});

                    const options = {
                        series: series,
                        chart: {
                            type: 'donut',
                            height: 350,
                            background: 'transparent',
                            foreColor: '#FFFFFF'
                        },
                        labels: labels,
                        colors: colors,
                        legend: {
                            position: 'bottom',
                            labels: { colors: '#FFFFFF' }
                        },
                        dataLabels: {
                            enabled: true,
                            style: { colors: ['#FFFFFF'] }
                        }
                    };

                    const chart = new ApexCharts(document.querySelector("#status-chart"), options);
                    chart.render();
                    console.log('✅ Status chart rendered');
                } else {
                    dataDiv.innerHTML = `<span class="error">❌ No data in response</span>`;
                }
            } catch (error) {
                console.error('Status chart error:', error);
                dataDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        // Test Hourly Chart
        async function testHourlyChart() {
            const dataDiv = document.getElementById('hourly-data');
            try {
                console.log('Fetching hourly data from:', `${baseUrl}hourly?${params}`);
                const response = await fetch(`${baseUrl}hourly?${params}`);
                const result = await response.json();

                console.log('Hourly data received:', result);
                dataDiv.textContent = JSON.stringify(result, null, 2);

                if (result.success && result.data) {
                    const categories = result.data.map(d => d.label);
                    const data = result.data.map(d => d.count);

                    console.log('Creating hourly chart with:', {categories, data});

                    const options = {
                        series: [{
                            name: 'Orders',
                            data: data
                        }],
                        chart: {
                            type: 'bar',
                            height: 350,
                            background: 'transparent',
                            foreColor: '#FFFFFF'
                        },
                        xaxis: {
                            categories: categories,
                            labels: { style: { colors: '#FFFFFF' } }
                        },
                        yaxis: {
                            labels: { style: { colors: '#FFFFFF' } }
                        },
                        colors: ['#D8276B'],
                        dataLabels: {
                            enabled: true,
                            style: { colors: ['#FFFFFF'] }
                        }
                    };

                    const chart = new ApexCharts(document.querySelector("#hourly-chart"), options);
                    chart.render();
                    console.log('✅ Hourly chart rendered');
                } else {
                    dataDiv.innerHTML = `<span class="error">❌ No data in response</span>`;
                }
            } catch (error) {
                console.error('Hourly chart error:', error);
                dataDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        // Test 90-Day Trend Chart
        async function testTrendChart() {
            const dataDiv = document.getElementById('trend-data');
            try {
                console.log('Fetching trend data from:', `${baseUrl}trend?${params}`);
                const response = await fetch(`${baseUrl}trend?${params}`);
                const result = await response.json();

                console.log('Trend data received:', result);
                dataDiv.textContent = JSON.stringify(result, null, 2).substring(0, 1000) + '...';

                if (result.success && result.data) {
                    const dates = result.data.map(d => d.date_formatted);
                    const totalOrders = result.data.map(d => d.total_orders);
                    const delivered = result.data.map(d => d.delivered);

                    console.log('Creating trend chart with:', {dates: dates.length, totalOrders: totalOrders.length});

                    const options = {
                        series: [
                            { name: 'Total Orders', data: totalOrders },
                            { name: 'Delivered', data: delivered }
                        ],
                        chart: {
                            type: 'line',
                            height: 350,
                            background: 'transparent',
                            foreColor: '#FFFFFF'
                        },
                        xaxis: {
                            categories: dates,
                            labels: {
                                style: { colors: '#FFFFFF' },
                                rotate: -45
                            }
                        },
                        yaxis: {
                            labels: { style: { colors: '#FFFFFF' } }
                        },
                        colors: ['#D8276B', '#10b981'],
                        stroke: { curve: 'smooth', width: 3 },
                        legend: {
                            position: 'top',
                            labels: { colors: '#FFFFFF' }
                        }
                    };

                    const chart = new ApexCharts(document.querySelector("#trend-chart"), options);
                    chart.render();
                    console.log('✅ Trend chart rendered');
                } else {
                    dataDiv.innerHTML = `<span class="error">❌ No data in response</span>`;
                }
            } catch (error) {
                console.error('Trend chart error:', error);
                dataDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        // Run all tests
        async function runTests() {
            console.log('🟢 Starting tests...');
            const apiOk = await testAPI();

            if (apiOk) {
                await testStatusChart();
                await testHourlyChart();
                await testTrendChart();
                console.log('🟢 All tests complete');
            } else {
                console.error('❌ API test failed, skipping chart tests');
            }
        }

        // Run on load
        window.addEventListener('load', runTests);
    </script>
</body>
</html>
