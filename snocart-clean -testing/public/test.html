<!DOCTYPE html>
<html>
<head>
  <title>Snocart WebSocket Test</title>
  <script src="https://js.pusher.com/7.2/pusher.min.js"></script>
</head>
<body>
  <h1>Snocart WebSocket Test</h1>
  <div id="status">Connecting...</div>
  <div id="messages"></div>

  <script>
    // Enable logging (shows events in browser console)
    Pusher.logToConsole = true;

    // Init with your local app key
    var pusher = new Pusher('localKey123', {
      wsHost: 'new.snocart.com',
      wsPort: 443,
      wssPort: 443,
      forceTLS: true,
      enabledTransports: ['ws', 'wss'],
      disableStats: true,
    });

    pusher.connection.bind('connected', function() {
      document.getElementById("status").innerText = "✅ Connected to WebSocket server!";
    });

    pusher.connection.bind('error', function(err) {
      console.error("Connection error:", err);
      document.getElementById("status").innerText = "❌ Connection error (check console)";
    });

    // Subscribe to test channel
    var channel = pusher.subscribe('orders');
    channel.bind('TestWebSocketEvent', function(data) {
      console.log("Got event:", data);
      document.getElementById("messages").innerHTML += "<p>📩 Event: " + JSON.stringify(data) + "</p>";
    });
  </script>
</body>
</html>
