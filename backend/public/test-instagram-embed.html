<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Instagram Embed Test</title>
</head>
<body>
    <h1>Instagram Embed Test</h1>
    
    <h2>Method 1: Direct Blockquote</h2>
    <blockquote class="instagram-media"
        data-instgrm-permalink="https://www.instagram.com/reel/C5K8WYLvN8s/"
        data-instgrm-version="14"
        style="background:#FFF; border:0; border-radius:8px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5); margin: 1px; max-width:540px; min-width:326px; padding:0; width:99.375%;">
        <div style="padding:16px;">
            <a href="https://www.instagram.com/reel/C5K8WYLvN8s/" target="_blank">
                View this post on Instagram
            </a>
        </div>
    </blockquote>
    
    <h2>Method 2: Dynamic Insert</h2>
    <div id="dynamic-embed"></div>
    
    <button onclick="loadDynamicEmbed()">Load Dynamic Embed</button>
    
    <!-- Instagram Embed Script -->
    <script async src="https://www.instagram.com/embed.js"></script>
    
    <script>
        function loadDynamicEmbed() {
            const embedHtml = `
                <blockquote class="instagram-media"
                    data-instgrm-permalink="https://www.instagram.com/reel/C5K8WYLvN8s/"
                    data-instgrm-version="14">
                    <div style="padding:16px;">
                        <a href="https://www.instagram.com/reel/C5K8WYLvN8s/" target="_blank">
                            View this post on Instagram
                        </a>
                    </div>
                </blockquote>
            `;
            
            document.getElementById('dynamic-embed').innerHTML = embedHtml;
            
            // Wait for script to load and process
            setTimeout(function() {
                if (window.instgrm) {
                    console.log('Instagram object found, processing embeds...');
                    window.instgrm.Embeds.process();
                } else {
                    console.error('Instagram embed script not loaded!');
                }
            }, 1000);
        }
        
        // Auto-process after 2 seconds
        setTimeout(function() {
            console.log('Checking Instagram script status...');
            console.log('window.instgrm:', window.instgrm);
        }, 2000);
    </script>
</body>
</html>
