<!DOCTYPE html>
<html>
<head>
    <title>Search Test</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Global Search Test</h2>
        <button type="button" id="modalOpener" class="btn btn-primary" data-toggle="modal" data-target="#staticBackdrop">
            Open Search Modal
        </button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Search Test</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" placeholder="Type to search..." id="searchInput">
                    <div id="searchResults" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script>
        // Test Ctrl+K
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'k') {
                event.preventDefault();
                $('#staticBackdrop').modal('show');
                console.log('Ctrl+K pressed - modal should open');
            }
        });

        // Test search input
        $('#searchInput').on('keyup', function() {
            console.log('Search input:', $(this).val());
            $('#searchResults').html('<p>Searching for: ' + $(this).val() + '</p>');
        });

        // Test modal open
        $('#staticBackdrop').on('shown.bs.modal', function() {
            console.log('Modal opened successfully');
            $('#searchInput').focus();
        });

        console.log('Test page loaded. Try:');
        console.log('1. Click the button');
        console.log('2. Press Ctrl+K');
        console.log('3. Type in the search box');
    </script>
</body>
</html>
